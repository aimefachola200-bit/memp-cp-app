  <script>
    /* Filet de sécurité : si rien n'apparaît au bout de quelques secondes, on explique pourquoi
       au lieu de laisser un écran vide (le plus souvent : une autre fenêtre de l'application,
       restée ouverte sur l'ancienne version, bloque la mise à jour de la base locale). */
    setTimeout(function () {
      var c = document.getElementById('chargement');
      if (!c) return;
      var t = document.getElementById('chargement-texte');
      if (t.textContent.indexOf('déjà ouvert') >= 0) return; /* message plus précis déjà affiché */
      t.textContent =
        'Le démarrage prend plus de temps que prévu. Si ÉduGestion Pro Master est déjà ouvert dans un autre onglet ou une autre fenêtre, fermez-le, puis rechargez cette page.';
      document.getElementById('chargement-recharger').hidden = false;
    }, 6000);
  </script>
